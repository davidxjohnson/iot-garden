name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

# Prevent race conditions - only allow one auto-merge workflow at a time per PR
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    
    # Only run on dependabot PRs
    if: contains(github.actor, 'dependabot') || github.event.pull_request.user.login == 'app/dependabot'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Stagger concurrent workflows
      uses: actions/github-script@v7
      with:
        script: |
          // Add random delay 0-30 seconds to prevent race conditions
          const delay = Math.floor(Math.random() * 30000);
          console.log(`⏲️ Staggering workflow start by ${Math.round(delay/1000)} seconds to prevent race conditions`);
          await new Promise(resolve => setTimeout(resolve, delay));

    - name: Get PR details
      id: pr-details
      uses: actions/github-script@v7
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          console.log('PR Title:', pr.data.title);
          console.log('PR Labels:', pr.data.labels.map(l => l.name));
          
          return {
            title: pr.data.title,
            labels: pr.data.labels.map(l => l.name),
            isDraft: pr.data.draft
          };

    - name: Wait for CI checks
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const sha = context.payload.pull_request.head.sha;
          const pr_number = context.payload.pull_request.number;
          
          console.log(`🔍 Waiting for CI checks on PR #${pr_number} (${sha.substring(0, 7)})`);
          
          // Reduced wait time to 5 minutes to prevent long queues
          const maxWaitTime = 5 * 60 * 1000; // 5 minutes
          const startTime = Date.now();
          let checkCount = 0;
          
          while (Date.now() - startTime < maxWaitTime) {
            checkCount++;
            console.log(`📊 Check attempt #${checkCount} (${Math.round((Date.now() - startTime) / 1000)}s elapsed)`);
            
            try {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha
              });
              
              const statuses = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha
              });
              
              const allChecks = [...checks.data.check_runs, ...statuses.data];
              console.log(`📋 Found ${allChecks.length} total checks`);
              
              if (allChecks.length === 0) {
                console.log('⏳ No checks found yet, waiting...');
                await new Promise(resolve => setTimeout(resolve, 20000)); // Reduced from 30s to 20s
                continue;
              }
              
              // Filter out this workflow's own checks to avoid circular dependency
              const relevantChecks = allChecks.filter(check => 
                !check.name?.includes('Dependabot Auto-Merge') &&
                !check.name?.includes('Security Updates Handler')
              );
              
              const pending = relevantChecks.filter(check => 
                check.status === 'queued' || 
                check.status === 'in_progress' || 
                check.state === 'pending'
              );
              
              const failed = relevantChecks.filter(check => 
                check.conclusion === 'failure' || 
                check.state === 'failure' ||
                check.state === 'error'
              );
              
              const successful = relevantChecks.filter(check =>
                check.conclusion === 'success' ||
                check.state === 'success'
              );
              
              console.log(`✅ Successful: ${successful.length}, ⏳ Pending: ${pending.length}, ❌ Failed: ${failed.length}`);
              
              if (failed.length > 0) {
                console.log('❌ Some checks failed:');
                failed.forEach(check => console.log(`  - ${check.name}: ${check.conclusion || check.state}`));
                core.setFailed('CI checks failed');
                return;
              }
              
              if (pending.length === 0 && successful.length > 0) {
                console.log('🎉 All relevant checks passed!');
                return;
              }
              
              console.log(`⏳ Still waiting for ${pending.length} checks...`);
              pending.forEach(check => console.log(`  - ${check.name}: ${check.status || check.state}`));
              
              await new Promise(resolve => setTimeout(resolve, 20000));
              
            } catch (error) {
              console.error('❌ Error checking CI status:', error);
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
          }
          
          console.log('⏰ Timeout reached waiting for checks to complete');
          core.setFailed('Timeout waiting for checks to complete');

    - name: Auto-approve and merge
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const pull_number = context.issue.number;
          
          // Get the PR to check if it's still open
          const pr = await github.rest.pulls.get({
            owner,
            repo,
            pull_number
          });
          
          if (pr.data.state !== 'open') {
            console.log('PR is no longer open, skipping merge');
            return;
          }
          
          const title = pr.data.title.toLowerCase();
          const labels = pr.data.labels.map(l => l.name.toLowerCase());
          
          // Determine merge strategy based on PR type
          let shouldAutoMerge = false;
          let mergeMethod = 'squash'; // Default to squash merge
          
          // Auto-merge patch and minor updates
          if (title.includes('patch') || 
              title.includes('minor') || 
              labels.includes('auto-merge-candidate')) {
            shouldAutoMerge = true;
          }
          
          // Don't auto-merge major version updates or security updates without human review
          if (title.includes('major') || 
              title.includes('security') ||
              title.includes('breaking')) {
            console.log('Major version or security update detected, requiring manual review');
            
            // Add labels for human attention
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pull_number,
              labels: ['needs-human-review', 'major-version-update']
            });
            
            // Create a comment explaining why auto-merge was skipped
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `🤖 **Auto-merge skipped**\n\nThis PR contains major version updates or security patches that require human review before merging.\n\nPlease review the changes and merge manually if appropriate.`
            });
            
            return;
          }
          
          if (shouldAutoMerge) {
            try {
              // Double-check PR is still open and mergeable
              const latestPR = await github.rest.pulls.get({
                owner,
                repo,
                pull_number
              });
              
              if (latestPR.data.state !== 'open') {
                console.log('🔒 PR is no longer open (already merged or closed)');
                return;
              }
              
              if (latestPR.data.mergeable === false) {
                console.log('⚠️ PR is not mergeable (conflicts detected)');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: `⚠️ **Auto-merge blocked**\n\nThis PR has merge conflicts and cannot be automatically merged. Please resolve conflicts manually.`
                });
                return;
              }
              
              console.log(`🤖 Attempting to auto-merge PR #${pull_number}...`);
              
              // Approve the PR
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: '🤖 Auto-approved by dependabot automation - CI checks passed'
              });
              
              // Small delay before merge to ensure approval is processed
              await new Promise(resolve => setTimeout(resolve, 2000));
              
              // Merge the PR
              const mergeResult = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: mergeMethod,
                commit_title: `${pr.data.title} (#${pull_number})`,
                commit_message: 'Auto-merged by dependabot automation'
              });
              
              console.log('✅ Successfully auto-merged dependabot PR');
              console.log(`📄 Merge SHA: ${mergeResult.data.sha}`);
              
              // Add success comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `🎉 **Auto-merged successfully!**\n\nThis dependabot update has been automatically merged after all CI checks passed.\n\n**Merge commit:** \`${mergeResult.data.sha.substring(0, 7)}\``
              });
              
            } catch (error) {
              console.error('❌ Failed to merge PR:', error);
              
              // Check if it's a specific merge conflict
              let errorMessage = error.message;
              if (error.status === 409) {
                errorMessage = 'Another merge operation may be in progress, or there are merge conflicts.';
              } else if (error.status === 422) {
                errorMessage = 'PR is not in a mergeable state (possibly already merged by another process).';
              }
              
              // Add failure comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `⚠️ **Auto-merge failed**\n\nFailed to automatically merge this PR. Please check for conflicts or merge manually.\n\n**Error:** ${errorMessage}\n\n**Status Code:** ${error.status || 'unknown'}`
              });
              
              // Add label for human attention
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ['auto-merge-failed']
              });
            }
          } else {
            console.log('PR does not meet auto-merge criteria');
          }

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [auto-merge]
    if: failure() && github.actor == 'dependabot[bot]'
    
    steps:
    - name: Create issue on workflow failure
      uses: actions/github-script@v7
      with:
        script: |
          const title = `🚨 Dependabot Auto-Merge Workflow Failed`;
          const body = `
          The dependabot auto-merge workflow failed for PR #${{ github.event.number }}.
          
          **Failed workflow:** ${{ github.workflow }}
          **Run ID:** ${{ github.run_id }}
          **PR:** #${{ github.event.number }}
          
          Please investigate and resolve the issue.
          
          [View failed workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;
          
          // Check if a similar issue already exists
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'auto-merge-failure',
            state: 'open'
          });
          
          if (existingIssues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'auto-merge-failure', 'needs-attention']
            });
          }